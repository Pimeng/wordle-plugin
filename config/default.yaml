# Wordle 插件默认配置
# 请勿直接修改本文件，修改 config/config.yaml 即可

# 帮助图渲染配置
render:
  # 帮助图样式：
  #   white = 白底立绘（内置 https://t.alcy.cc/bd）
  #   blur  = 竖图模糊羽化（内置 https://t.alcy.cc/moemp）
  preset: blur
  # 自定义背景图地址；留空时使用预置的内置地址
  background: ""
  # 背景模糊度（px），仅模糊相关版式生效
  backgroundBlur: 16
  # 背景图缓存时间（秒），避免频繁请求随机图接口；为 0 表示不缓存
  backgroundCache: 60
  # 版式模式；留空时跟随预置，也可填写 white / photo / portrait
  backgroundMode: ""
