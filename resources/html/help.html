<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>Wordle 帮助</title>
  <style>
    /* Google Sans 优先（拉丁/数字），MiSans 作为中文回退 */
    {{ if googleSansFont }}
    @font-face {
      font-family: "Google Sans";
      src: url("{{@ googleSansFont }}") format("truetype-variations"),
           url("{{@ googleSansFont }}") format("truetype");
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
    }
    {{ /if }}
    {{ if miSansFont }}
    @font-face {
      font-family: "MiSans";
      src: url("{{@ miSansFont }}") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    {{ /if }}

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Google Sans", "MiSans", "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", "Source Han Sans SC", sans-serif;
      background: transparent;
      display: inline-block;
    }

    #container {
      --card-bg: var(--bg-tone, #ffffff);
      --text: #17212d;
      --text-dim: #53657a;
      --accent: #3f7d3a;
      --border: rgba(25, 52, 79, 0.15);
      --marker: rgba(63, 125, 58, 0.6);
      --footer-fg: #14202d;
      --footer-sub: #53657a;

      width: 1920px;
      min-height: 1080px;
      color: var(--text);
      position: relative;
      overflow: hidden;
      background: var(--card-bg);
      display: flex;
      align-items: stretch;
    }

    #container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      z-index: 2;
      background: linear-gradient(90deg, #6aaa64, #c9b458 55%, #6aaa64);
    }

    .bg-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
      display: none;
    }

    .bg-backdrop {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
      display: none;
    }

    .bg-scrim {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      display: none;
    }

    /* 白底素材：原图完整显示，右对齐，左侧留白 */
    .bg-white .bg-layer {
      display: block;
      inset: 0 0 auto auto;
      top: 50%;
      width: auto;
      height: 100%;
      object-fit: contain;
      transform: translateY(-50%);
    }

    /* 普通背景图：原画保持清晰，只在内容列后方做局部磨砂 */
    .bg-photo .bg-layer {
      display: block;
      filter: saturate(0.9) contrast(0.97);
      transform: scale(1.015);
    }

    .bg-photo .bg-scrim {
      display: block;
      background:
        linear-gradient(90deg,
          rgba(250, 252, 255, 0.97) 0%,
          rgba(247, 251, 255, 0.93) 50%,
          rgba(243, 248, 253, 0.84) 64%,
          rgba(238, 245, 251, 0.50) 74%,
          rgba(232, 241, 249, 0.12) 84%,
          transparent 92%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 62%, rgba(12, 26, 42, 0.16));
      -webkit-backdrop-filter: blur(var(--bg-blur, 8px)) saturate(0.82);
      backdrop-filter: blur(var(--bg-blur, 8px)) saturate(0.82);
      -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 72%, rgba(0, 0, 0, 0.78) 80%, transparent 94%);
      mask-image: linear-gradient(90deg, #000 0%, #000 72%, rgba(0, 0, 0, 0.78) 80%, transparent 94%);
    }

    /* 竖版插画固定在右栏：清晰主图 + 同图模糊补边 */
    .bg-portrait .bg-backdrop {
      display: block;
      inset: 0 0 0 auto;
      width: 1100px;
      height: 100%;
      object-fit: cover;
      filter: blur(calc(var(--bg-blur, 8px) * 2.6)) saturate(0.78) brightness(0.94);
      transform: scale(1.04);
      opacity: 0.68;
      -webkit-mask-image: linear-gradient(90deg,
        transparent 0%,
        rgba(0, 0, 0, 0.08) 12%,
        rgba(0, 0, 0, 0.36) 28%,
        rgba(0, 0, 0, 0.76) 46%,
        #000 66%);
      mask-image: linear-gradient(90deg,
        transparent 0%,
        rgba(0, 0, 0, 0.08) 12%,
        rgba(0, 0, 0, 0.36) 28%,
        rgba(0, 0, 0, 0.76) 46%,
        #000 66%);
    }

    .bg-portrait .bg-layer {
      display: block;
      inset: 0 0 auto auto;
      top: 50%;
      width: auto;
      height: 100%;
      object-fit: contain;
      filter: saturate(0.94) contrast(0.98);
      transform: translateY(-50%);
      -webkit-mask-image: linear-gradient(90deg,
        transparent 0%,
        rgba(0, 0, 0, 0.08) 7%,
        rgba(0, 0, 0, 0.38) 18%,
        rgba(0, 0, 0, 0.78) 31%,
        #000 44%);
      mask-image: linear-gradient(90deg,
        transparent 0%,
        rgba(0, 0, 0, 0.08) 7%,
        rgba(0, 0, 0, 0.38) 18%,
        rgba(0, 0, 0, 0.78) 31%,
        #000 44%);
    }

    .bg-portrait .bg-scrim {
      display: block;
      inset: 0 0 0 auto;
      width: 1050px;
      background: linear-gradient(90deg,
        #ffffff 0%,
        rgba(255, 255, 255, 0.98) 16%,
        rgba(255, 255, 255, 0.92) 27%,
        rgba(255, 255, 255, 0.72) 40%,
        rgba(255, 255, 255, 0.42) 52%,
        rgba(255, 255, 255, 0.14) 64%,
        transparent 76%);
    }

    /* 内容固定左侧，右侧留给背景素材 */
    .content {
      position: relative;
      z-index: 1;
      width: 1280px;
      min-height: 1080px;
      padding: 32px 0 22px 64px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .head {
      flex: none;
      display: flex;
      align-items: center;
      gap: 19px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--border);
    }

    .head .logo {
      flex: none;
      width: 13px;
      height: 62px;
      border-radius: 6px;
      background: linear-gradient(180deg, #6aaa64, #c9b458);
    }

    .head .title {
      font-size: 54px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .sections {
      flex: none;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-title {
      font-size: 41px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .items {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 每行：圆点标记 + 固定宽度指令列 + 说明，说明因此左对齐成一列 */
    .item {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .item::before {
      content: "";
      flex: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--marker);
    }

    /* 指令列为固定宽度的纯文本（无底色方框），保证说明文字左对齐成一列 */
    .cmd {
      flex: none;
      width: 623px;
      font-size: 36px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .desc {
      flex: 1;
      min-width: 0;
      font-size: 30px;
      color: var(--text-dim);
      line-height: 1.4;
    }

    .footer {
      flex: none;
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 24px;
      color: var(--footer-sub);
    }

    .footer .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      font-weight: 700;
      color: var(--footer-fg);
      letter-spacing: 0.5px;
    }

    .footer .bar { width: 8px; height: 27px; border-radius: 4px; background: var(--footer-fg); }
  </style>
</head>

<body class="bg-{{mode}}">
  <div id="container" style="--bg-blur: {{ backgroundBlur }}px">
    {{ if background }}
    <img class="bg-backdrop" src="{{@ background }}" alt="">
    <img id="bgLayer" class="bg-layer" src="{{@ background }}" alt="">
    <div class="bg-scrim"></div>
    {{ /if }}
    <div class="content">
      <div class="head">
        <div class="logo"></div>
        <div class="title">Wordle 猜词游戏</div>
      </div>

      <div class="sections">
        {{ each sections section }}
        <div class="section">
          <div class="section-title">{{ section.title }}</div>
          <div class="items">
            {{ each section.items item }}
            <div class="item">
              <div class="cmd">{{ item.cmd }}</div>
              <div class="desc">{{ item.desc }}</div>
            </div>
            {{ /each }}
          </div>
        </div>
        {{ /each }}
      </div>

      <div class="footer">
        <div class="brand"><span class="bar"></span>{{ footer }}</div>
      </div>
    </div>
  </div>
</body>

</html>
